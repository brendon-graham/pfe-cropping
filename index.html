    <td><select onchange="regrassMixChanged('${r.id}',this.value)" style="min-width:120px"${dis}>${opts}</select></td>
    <td><input class="num" type="number" value="${r.ha||''}" onchange="updateRegrassCalc('${r.id}','ha',this.value)" style="width:60px"${dis}></td>
    <td><input value="${r.drillDate||''}" onchange="updateRegrass('${r.id}','drillDate',this.value)" placeholder="dd/mm/yy" style="width:80px"${dis}></td>
    <td><input class="num" type="number" value="${r.seedHA||''}" onchange="updateRegrassCalc('${r.id}','seedHA',this.value)" style="width:70px"${dis}></td>
    <td><input class="num" type="number" value="${r.chemHA||''}" onchange="updateRegrassCalc('${r.id}','chemHA',this.value)" style="width:70px"${dis}></td>
    <td><input class="num" type="number" value="${r.fertHA||''}" onchange="updateRegrassCalc('${r.id}','fertHA',this.value)" style="width:70px"${dis}></td>
    <td><input class="num" type="number" value="${r.opsHA||''}" onchange="updateRegrassCalc('${r.id}','opsHA',this.value)" style="width:70px"${dis}></td>
    <td style="text-align:right;font-weight:600" id="rg-cost-${r.id}">${fmt$(regrassRowCost(r))}</td>
    <td><input value="${r.notes||''}" onchange="updateRegrass('${r.id}','notes',this.value)" style="min-width:100px"${dis}></td>
    <td>${locked ? '' : `<button class="del-btn" onclick="deleteRegrass('${r.id}')">✕</button>`}</td>
  </tr>`;
}

function addRegrassRow() {
  const mix = 'Italian Clover';
  const d = regrassDefaults(mix);
  const r = { id: uid(), year: activeYear, paddock:'', mix, ha:'', drillDate:'', seedHA: d.seedHA, chemHA: d.chemHA, fertHA: d.fertHA, opsHA: d.opsHA, notes:'' };
  regrass.push(r);
  save();
  renderRegrass();
  const row = document.getElementById('rg-' + r.id);
  if (row) row.querySelector('input').focus();
}

function updateRegrass(id, field, val) {
  const r = regrass.find(x => x.id === id);
  if (r) { r[field] = val; save(); }
}

function refreshRegrassTotals(id) {
  const r = regrass.find(x => x.id === id);
  const set = (i, v) => { const el = document.getElementById(i); if (el) el.textContent = v; };
  if (r) set('rg-cost-' + id, fmt$(regrassRowCost(r)));
  const tHa = totalRegrassHa();
  const tCost = totalRegrassCost();
  set('rg-tot-ha', tHa.toFixed(1));
  set('rg-tot-cost', fmt$(tCost));
  set('rg-card-ha', tHa.toFixed(1));
  set('rg-card-cost', fmt$(tCost));
  set('rg-card-avg', fmt$(tHa > 0 ? tCost/tHa : 0));
}

function updateRegrassCalc(id, field, val) {
  const r = regrass.find(x => x.id === id);
  if (!r) return;
  r[field] = val;
  save();
  refreshRegrassTotals(id);
}

function regrassMixChanged(id, mix) {
  const r = regrass.find(x => x.id === id);
  if (!r) return;
  r.mix = mix;
  const d = regrassDefaults(mix);
  r.seedHA = d.seedHA; r.chemHA = d.chemHA; r.fertHA = d.fertHA; r.opsHA = d.opsHA;
  save();
  renderRegrass();
}

function deleteRegrass(id) {
  regrass = regrass.filter(x => x.id !== id);
  save();
  renderRegrass();
}

// -- FINANCIAL --
function renderFinancial() {
  const byType = {};
  yearCrop().forEach(c => {
    if (!byType[c.crop]) byType[c.crop] = { ha:0, seed:0, chem:0, fert:0, ops:0, effDM:0 };
    const h = n(c.ha);
    byType[c.crop].ha    += h;
    byType[c.crop].seed  += h * n(c.seedHA);
    byType[c.crop].chem  += h * n(c.chemHA);
    byType[c.crop].fert  += h * n(c.fertHA);
    byType[c.crop].ops   += h * n(c.opsHA);
    byType[c.crop].effDM += effectiveGrossDM(c);
  });

  const cropRows = Object.entries(byType).map(([crop, v]) => {
    const total = v.seed + v.chem + v.fert + v.ops;
    const costPerNetDM = v.effDM > 0 ? total / v.effDM : 0;
    return `<tr>
      <td><span class="tag ${CROP_TAG[crop]||'tag-other'}">${crop}</span></td>
      <td style="text-align:right">${v.ha.toFixed(1)}</td>
      <td style="text-align:right">${fmt$(v.seed)}</td>
      <td style="text-align:right">${fmt$(v.chem)}</td>
      <td style="text-align:right">${fmt$(v.fert)}</td>
      <td style="text-align:right">${fmt$(v.ops)}</td>
      <td style="text-align:right;font-weight:700">${fmt$(total)}</td>
      <td style="text-align:right;color:var(--muted)">${fmt$(total/(v.ha||1))}/ha</td>
      <td style="text-align:right;font-weight:700;color:var(--info)">$${costPerNetDM.toFixed(3)}/kgDM</td>
    </tr>`;
  }).join('') || '<tr><td colspan="9" style="color:var(--muted);padding:12px">No crops entered</td></tr>';

  const suppRows = yearSupps().map(x => {
    const cost = n(x.kgDM) * n(x.costPerKgDM);
    return `<tr><td>${x.name||'-'}</td><td>${x.type||'-'}</td><td style="text-align:right">${fmtDM(x.kgDM)}</td><td style="text-align:right">${n(x.costPerKgDM).toFixed(3)}</td><td style="text-align:right;font-weight:700">${fmt$(cost)}</td></tr>`;
  }).join('') || '<tr><td colspan="5" style="color:var(--muted);padding:12px">No supplements entered</td></tr>';

  const pastRows = yearPasture().map(p => {
    const dm = pastureRowDM(p);
    return `<tr><td>${p.name||'-'}</td><td style="text-align:right">${fmtDM(dm)}</td><td style="text-align:right">${n(p.costPerKgDM) ? n(p.costPerKgDM).toFixed(3) : '—'}</td><td style="text-align:right;font-weight:700">${fmt$(dm*n(p.costPerKgDM))}</td></tr>`;
  }).join('') || '<tr><td colspan="4" style="color:var(--muted);padding:12px">No pasture blocks entered</td></tr>';

  const byMix = {};
  yearRegrass().forEach(r => {
    if (!byMix[r.mix]) byMix[r.mix] = { ha:0, cost:0 };
    byMix[r.mix].ha   += n(r.ha);
    byMix[r.mix].cost += regrassRowCost(r);
  });
  const regrassRows = Object.entries(byMix).map(([mix, v]) => `<tr>
    <td>${mix}</td>
    <td style="text-align:right">${v.ha.toFixed(1)}</td>
    <td style="text-align:right">${fmt$(v.ha > 0 ? v.cost/v.ha : 0)}/ha</td>
    <td style="text-align:right;font-weight:700">${fmt$(v.cost)}</td>
  </tr>`).join('') || '<tr><td colspan="4" style="color:var(--muted);padding:12px">No regrassing entered</td></tr>';

  const grandTotal = totalCropCost() + totalSuppCost() + pastureCost() + totalRegrassCost();
  const effTotal   = allCropGrownDM();

  document.getElementById('tab-financial').innerHTML = `
    <div class="cards" style="max-width:1100px">
      <div class="card"><div class="label">Crop Establishment</div><div class="value">${fmt$(totalCropCost())}</div></div>
      <div class="card"><div class="label">Supplements</div><div class="value">${fmt$(totalSuppCost())}</div></div>
      <div class="card"><div class="label">Pasture</div><div class="value">${fmt$(pastureCost())}</div></div>
      <div class="card"><div class="label">Regrassing</div><div class="value">${fmt$(totalRegrassCost())}</div></div>
      <div class="card"><div class="label">Total Programme</div><div class="value">${fmt$(grandTotal)}</div></div>
    </div>

    <div class="section-title">Crop Establishment Costs — ${activeYear}</div>
    <div class="tbl-wrap" style="margin-bottom:24px">
      <table>
        <thead><tr><th>Crop</th><th style="text-align:right">Ha</th><th style="text-align:right">Seed</th><th style="text-align:right">Chem</th><th style="text-align:right">Fert</th><th style="text-align:right">Ops</th><th style="text-align:right">Total</th><th style="text-align:right">$/ha</th><th style="text-align:right">$/kgDM grown${anyActuals() ? ' <span style="font-size:10px;font-weight:400">(actuals used where recorded)</span>' : ''}</th></tr></thead>
        <tbody>
          ${cropRows}
          <tr class="total-row">
            <td>Total</td>
            <td style="text-align:right">${totalHa().toFixed(1)}</td>
            <td colspan="4"></td>
            <td style="text-align:right">${fmt$(totalCropCost())}</td>
            <td style="text-align:right">${fmt$(totalCropCost()/(totalHa()||1))}/ha</td>
            <td style="text-align:right">$${effTotal > 0 ? (totalCropCost()/effTotal).toFixed(3) : '—'}/kgDM</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="section-title">Supplement / Feed Costs</div>
    <div class="tbl-wrap" style="margin-bottom:24px">
      <table>
        <thead><tr><th>Name</th><th>Type</th><th style="text-align:right">kgDM</th><th style="text-align:right">$/kgDM</th><th style="text-align:right">Total Cost</th></tr></thead>
        <tbody>
          ${suppRows}
          <tr class="total-row"><td colspan="4">Total supplements</td><td style="text-align:right">${fmt$(totalSuppCost())}</td></tr>
        </tbody>
      </table>
    </div>

    <div class="section-title">Pasture Costs</div>
    <div class="tbl-wrap" style="margin-bottom:24px">
      <table>
        <thead><tr><th>Block</th><th style="text-align:right">kgDM</th><th style="text-align:right">$/kgDM</th><th style="text-align:right">Total Cost</th></tr></thead>
        <tbody>
          ${pastRows}
          <tr class="total-row"><td colspan="3">Total pasture</td><td style="text-align:right">${fmt$(pastureCost())}</td></tr>
        </tbody>

function renderHistory() {
  const yrs = getYears();

  const rows = yrs.map(y => {
    const cp   = cropPlan.filter(c    => (c.year  || YEAR) === y);
    const sr   = stockReq.filter(r   => (r.year   || YEAR) === y);
    const su   = supplements.filter(x => (x.year  || YEAR) === y);
    const pa   = pasture.filter(p    => (p.year   || YEAR) === y);
    const rg   = regrass.filter(r    => (r.year   || YEAR) === y);
    const wc   = cp.filter(countsWinter);
    const ha        = cp.reduce((s,c) => s+n(c.ha), 0);
    const budCropDM = wc.reduce((s,c) => s+netDM(c), 0);
    const actCropDM = wc.some(c => hasActual(c)) ? wc.reduce((s,c) => s+effectiveNetDM(c), 0) : null;
    const sSup      = su.reduce((s,x) => s+n(x.kgDM), 0) + pa.reduce((s,p) => s+pastureRowDM(p), 0);
    const budSupply = budCropDM + sSup;
    const actSupply = actCropDM !== null ? actCropDM + sSup : null;
    const supply    = actSupply !== null ? actSupply : budSupply;
    const demand    = sr.reduce((s,r) => s+n(r.headCurr)*n(r.kgDMday)*n(r.days), 0);
    const cost      = cp.reduce((s,c) => s+rowCost(c), 0);
    const suppCost  = su.reduce((s,x) => s+n(x.kgDM)*n(x.costPerKgDM), 0);
    const pastCost  = pa.reduce((s,p) => s+pastureRowDM(p)*n(p.costPerKgDM), 0);
    const rgCost    = rg.reduce((s,r) => s+regrassRowCost(r), 0);
    const totCost   = cost + suppCost + pastCost + rgCost;
    const sur       = supply - demand;
    const isActive  = y === activeYear;
    const isClosed  = (settings.closedYears || []).includes(y);

    const supplyCell = actSupply !== null
      ? `${fmtT(actSupply)} <span style="font-size:10px;color:var(--info)" title="Actual recorded">▲</span>`
      : budSupply > 0 ? fmtT(budSupply) : '<span style="color:var(--muted)">—</span>';

    return `<tr class="yr-row${isActive?' yr-active':''}" onclick="changeYear('${y}');showTab('dashboard')">
      <td><span class="yr-badge">${y}</span>${isActive?' <span style="font-size:11px;color:var(--muted)">← viewing</span>':''}${isClosed?' <span style="font-size:11px;color:var(--warn)">🔒</span>':''}</td>
      <td style="text-align:right">${ha > 0 ? ha.toFixed(1) : '<span style="color:var(--muted)">—</span>'}</td>
      <td style="text-align:right">${cp.length > 0 ? cp.length : '<span style="color:var(--muted)">—</span>'}</td>
      <td style="text-align:right">${sr.length > 0 ? sr.length : '<span style="color:var(--muted)">—</span>'}</td>
      <td style="text-align:right">${supplyCell}</td>
      <td style="text-align:right">${demand > 0 ? fmtT(demand) : '<span style="color:var(--muted)">—</span>'}</td>
      <td style="text-align:right;font-weight:700;color:${sur>0?'var(--ok)':sur<0?'var(--danger)':'inherit'}">
        ${supply > 0 && demand > 0 ? (sur>=0?'+':'')+fmtT(sur) : '<span style="color:var(--muted)">—</span>'}
      </td>
      <td style="text-align:right">${cost > 0 ? fmt$(cost) : '<span style="color:var(--muted)">—</span>'}</td>
      <td style="text-align:right">${suppCost > 0 ? fmt$(suppCost) : '<span style="color:var(--muted)">—</span>'}</td>
      <td style="text-align:right">${pastCost > 0 ? fmt$(pastCost) : '<span style="color:var(--muted)">—</span>'}</td>
      <td style="text-align:right">${rgCost > 0 ? fmt$(rgCost) : '<span style="color:var(--muted)">—</span>'}</td>
      <td style="text-align:right;font-weight:700">${totCost > 0 ? fmt$(totCost) : '<span style="color:var(--muted)">—</span>'}</td>
      <td><button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();changeYear('${y}');showTab('crop')">Open →</button></td>
    </tr>`;
  }).join('');

  document.getElementById('tab-history').innerHTML = `
    <div class="section-title">All Seasons
      <button class="btn btn-sm btn-ghost" onclick="newYear()">+ New Season</button>
    </div>
    <p style="color:var(--muted);font-size:12px;margin:0 0 16px">Click any row to open that season. <span style="color:var(--info)">▲</span> = actual yield recorded. 🔒 = season locked.</p>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>Season</th>
          <th style="text-align:right">Total Ha</th>
          <th style="text-align:right">Paddocks</th>
          <th style="text-align:right">Stock Classes</th>
          <th style="text-align:right">DM Supply</th>
          <th style="text-align:right">DM Demand</th>
          <th style="text-align:right">Surplus / Deficit</th>
          <th style="text-align:right">Crop Cost</th>
          <th style="text-align:right">Supp Cost</th>
          <th style="text-align:right">Pasture Cost</th>
          <th style="text-align:right">Regrass Cost</th>
          <th style="text-align:right">Total Cost</th>
          <th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <p style="font-size:12px;color:var(--muted)">Seasons with no data show — . Use the seed functions in Apps Script to load historical data, or add paddocks manually after selecting the season from the header dropdown.</p>
    ${renderCropEfficiency()}`;
}

function renderCropEfficiency() {
  if (!cropPlan.length) return '';

  const allSeasons  = getYears().slice().reverse(); // oldest → newest
  const allCropTypes = [...new Set(cropPlan.map(c => c.crop))].sort();

  // Build matrix: crop → season → aggregated stats
  const matrix = {};
  allCropTypes.forEach(crop => {
    matrix[crop] = {};
    allSeasons.forEach(y => {
      const rows = cropPlan.filter(c => c.crop === crop && (c.year || YEAR) === y);
      if (!rows.length) return;
      const ha     = rows.reduce((s,c) => s + n(c.ha), 0);
      const cost   = rows.reduce((s,c) => s + rowCost(c), 0);
      const budDM  = rows.reduce((s,c) => s + grossDM(c), 0);
      const hasAct = rows.some(c => hasActual(c));
      const actDM  = hasAct ? rows.reduce((s,c) => s + effectiveGrossDM(c), 0) : null;
      matrix[crop][y] = { ha, cost, budDM, actDM };
    });
  });

  const activeCrops = allCropTypes.filter(crop => Object.keys(matrix[crop]).length > 0);
  if (!activeCrops.length) return '';

  function dmColor(v) {
    if (!v) return 'inherit';
    if (v < 0.13) return 'var(--ok)';
    if (v < 0.18) return 'var(--warn)';
    return 'var(--danger)';
  }

  // Season matrix table
  const seasonThs = allSeasons.map(y => `<th style="text-align:center;min-width:88px">${y}</th>`).join('');

  const matrixRows = activeCrops.map(crop => {
    // All-season weighted avg (budget)
    const allV      = Object.values(matrix[crop]);
    const totCost   = allV.reduce((s,v) => s + v.cost, 0);
    const totBudDM  = allV.reduce((s,v) => s + v.budDM, 0);
    const avgBud    = totBudDM > 0 ? totCost / totBudDM : 0;

    const cells = allSeasons.map(y => {
      const v = matrix[crop][y];
      if (!v) return `<td style="text-align:center;color:var(--muted);background:#FAFAFA">—</td>`;
      const effDM  = v.actDM !== null ? v.actDM : v.budDM;
      const cPerDM = effDM > 0 ? v.cost / effDM : 0;
      const col    = dmColor(cPerDM);
      const actMk  = v.actDM !== null ? ` <span style="color:var(--info)" title="Actual yield recorded">▲</span>` : '';
      return `<td style="text-align:center">
        <div style="font-weight:700;color:${col}">$${cPerDM.toFixed(3)}</div>
        <div style="font-size:10px;color:var(--muted)">${v.ha.toFixed(0)} ha${actMk}</div>
      </td>`;
    }).join('');

    return `<tr>
      <td style="white-space:nowrap"><span class="tag ${CROP_TAG[crop]||'tag-other'}">${crop}</span></td>
      ${cells}
      <td style="text-align:center;font-weight:700;color:${dmColor(avgBud)}">$${avgBud.toFixed(3)}</td>
    </tr>`;
  }).join('');

  // Ranked summary with trend
  const ranked = activeCrops.map(crop => {
    const allV     = Object.values(matrix[crop]);
    const seasons  = Object.keys(matrix[crop]);
    const totHa    = allV.reduce((s,v) => s + v.ha, 0);
    const totCost  = allV.reduce((s,v) => s + v.cost, 0);
    const totBudDM = allV.reduce((s,v) => s + v.budDM, 0);
    const budPerDM = totBudDM > 0 ? totCost / totBudDM : 0;

    // Actual $/kgDM where actuals exist
    const actV     = allV.filter(v => v.actDM !== null);
    const actPerDM = actV.length > 0
      ? actV.reduce((s,v) => s + v.cost, 0) / actV.reduce((s,v) => s + v.actDM, 0)
      : null;

    // Trend: compare first and last season's $/kgDM
    const sortedYrs = seasons.sort();
    let trend = '<span style="color:var(--muted)">—</span>';
    if (sortedYrs.length >= 2) {
      const fv = matrix[crop][sortedYrs[0]];
      const lv = matrix[crop][sortedYrs[sortedYrs.length - 1]];
      const fRate = fv.budDM > 0 ? fv.cost / fv.budDM : 0;
      const lEff  = lv.actDM !== null ? lv.actDM : lv.budDM;
      const lRate = lEff > 0 ? lv.cost / lEff : 0;
      if (lRate < fRate * 0.95)      trend = `<span style="color:var(--ok);font-weight:600">↓ Improving</span>`;
      else if (lRate > fRate * 1.05) trend = `<span style="color:var(--danger);font-weight:600">↑ Worsening</span>`;
      else                            trend = `<span style="color:var(--muted)">→ Stable</span>`;
    }

    return { crop, seasons: seasons.length, totHa, budPerDM, actPerDM, trend };
  }).sort((a,b) => a.budPerDM - b.budPerDM);

  const rankedRows = ranked.map((r, i) => `<tr>
    <td style="color:var(--muted);font-weight:700">#${i+1}</td>
    <td><span class="tag ${CROP_TAG[r.crop]||'tag-other'}">${r.crop}</span></td>
    <td style="text-align:right">${r.seasons}</td>
    <td style="text-align:right">${r.totHa.toFixed(0)} ha</td>
    <td style="text-align:right;font-weight:700;color:${dmColor(r.budPerDM)}">$${r.budPerDM.toFixed(3)}/kgDM</td>
    <td style="text-align:right">${r.actPerDM !== null
      ? `<span style="color:var(--info);font-weight:700">$${r.actPerDM.toFixed(3)}/kgDM</span>`
      : '<span style="color:var(--muted)">—</span>'}</td>
    <td>${r.trend}</td>
  </tr>`).join('');

  return `
    <div style="margin-top:32px">
      <div class="section-title">Crop Efficiency — All Seasons
        <span style="font-size:12px;font-weight:400;color:var(--muted)">$/kgDM grown (wastage not applied — feed budget only)</span>
      </div>
      <p style="font-size:12px;color:var(--muted);margin:0 0 16px">
        <span style="color:var(--ok);font-weight:700">Green &lt;$0.13</span> &nbsp;·&nbsp;
        <span style="color:var(--warn);font-weight:700">Amber $0.13–0.18</span> &nbsp;·&nbsp;
        <span style="color:var(--danger);font-weight:700">Red &gt;$0.18</span> &nbsp;·&nbsp;
        <span style="color:var(--info)">▲</span> = actual yield used &nbsp;·&nbsp;
        Trend compares first vs most recent season
      </p>

      <div class="section-title" style="font-size:14px">$/kgDM by Crop Type × Season</div>
      <div class="tbl-wrap" style="margin-bottom:24px">
        <table>
          <thead><tr>
            <th>Crop</th>
            ${seasonThs}
            <th style="text-align:center">All-Season Avg</th>
          </tr></thead>
          <tbody>${matrixRows}</tbody>
        </table>
      </div>

      <div class="section-title" style="font-size:14px">Ranked cheapest → most expensive (budget basis)</div>
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th></th><th>Crop</th>
            <th style="text-align:right">Seasons</th>
            <th style="text-align:right">Total Ha</th>
            <th style="text-align:right">Budget $/kgDM</th>
            <th style="text-align:right">Actual $/kgDM</th>
            <th>Trend (first → latest season)</th>
          </tr></thead>
          <tbody>${rankedRows}</tbody>
        </table>
      </div>
    </div>`;
}

// -- GROSS MARGINS --
const GM_CATS = ['Operations','Seed','Chemical','Fertiliser'];

function renderGM() {
  const crop  = activeGMCrop;
  const items = gmItemsFor(crop);
  const yieldKg = gmYieldOf(crop);
  const total = gmTotalHa(crop);
  const perGrown = yieldKg > 0 ? total / yieldKg : null;
  const cropSel  = GM_CROPS.map(c => `<option${c===crop?' selected':''}>${c}</option>`).join('');
  const feeds    = Object.entries(GM_SOURCE).filter(([,v]) => v === crop).map(([k]) => k);

  const catTables = GM_CATS.map(cat => {
    const catItems = items.filter(g => g.category === cat);
    const rows = catItems.map(g => `<tr class="data-row" id="gmr-${g.id}">
      <td><input value="${g.item||''}" onchange="updateGMItem('${g.id}','item',this.value)" placeholder="Product / operation" style="min-width:170px"></td>
      <td><input class="num" type="number" step="0.01" value="${g.price !== '' && g.price !== null ? g.price : ''}" onchange="updateGMItem('${g.id}','price',this.value)" style="width:85px"></td>
      <td><input class="num" type="number" step="0.01" value="${g.packSize !== '' && g.packSize !== null ? g.packSize : ''}" onchange="updateGMItem('${g.id}','packSize',this.value)" style="width:80px"></td>
      <td><input value="${g.unit||''}" onchange="updateGMItem('${g.id}','unit',this.value)" style="width:70px"></td>
      <td><input class="num" type="number" step="0.01" value="${g.ratePerHa !== '' && g.ratePerHa !== null ? g.ratePerHa : ''}" onchange="updateGMItem('${g.id}','ratePerHa',this.value)" style="width:85px"></td>
      <td style="text-align:right;color:var(--muted)">$${gmUnitPrice(g).toFixed(2)}</td>
      <td style="text-align:right;font-weight:600">$${gmLineTotal(g).toFixed(2)}</td>
      <td><button class="del-btn" onclick="deleteGMItem('${g.id}')">✕</button></td>
    </tr>`).join('');
    return `
      <div style="margin-bottom:20px">
        <div class="section-title" style="font-size:14px">${cat}
          <span style="font-weight:700;color:var(--text)">${fmt$(gmCatTotal(crop,cat))}/ha</span>
        </div>
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>Item</th><th style="text-align:right">Price $</th><th style="text-align:right">Pack size</th><th>Unit</th><th style="text-align:right">Rate/ha</th><th style="text-align:right">$/unit</th><th style="text-align:right">$/ha</th><th></th></tr></thead>
            <tbody>${rows || `<tr><td colspan="8" style="color:var(--muted);padding:10px">No ${cat.toLowerCase()} lines</td></tr>`}</tbody>
          </table>
          <div class="add-row"><button onclick="addGMItem('${cat}')">+ Add ${cat.toLowerCase()} line</button></div>
        </div>
      </div>`;
  }).join('');

  document.getElementById('tab-gm').innerHTML = `
    <div class="toolbar">
      <div class="section-title" style="flex:1;border:none;margin:0">Gross Margins
        <span style="font-size:12px;font-weight:400;color:var(--muted)">crop input costings — source: Cropping plan 27.xlsx</span>
      </div>
      <select onchange="gmCropChanged(this.value)" style="font-size:14px;padding:8px 10px">${cropSel}</select>
    </div>

    <div class="cards">
      <div class="card">
        <div class="label">Total Cost</div>
        <div class="value">${fmt$(total)}</div>
        <div class="sub">per ha</div>
      </div>
      <div class="card">
        <div class="label">Budget Yield</div>
        <div class="value"><input class="num" type="number" value="${yieldKg||''}" onchange="gmYieldChanged(this.value)" style="width:100px;font-size:18px;font-weight:700"></div>
        <div class="sub">kgDM/ha</div>
      </div>
      <div class="card">
        <div class="label">Cost per kgDM grown</div>
        <div class="value">${perGrown !== null ? (perGrown*100).toFixed(1) + 'c' : '—'}</div>
        <div class="sub">${perGrown !== null ? '$' + perGrown.toFixed(3) + ' per kgDM — wastage applies to feed budget only' : 'set budget yield'}</div>
      </div>
    </div>

    ${catTables}

    <div style="margin-top:8px;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--muted)">
      ${feeds.length
        ? `This GM sets the default Seed / Chem / Fert / Ops $/ha for <strong>${feeds.join(', ')}</strong> rows in the Crop Plan (applied when a paddock is added or its crop type changed).
           <button class="btn btn-sm btn-primary" style="margin-left:8px" onclick="applyGMToSeason()">Apply to ${activeYear} rows</button>`
        : 'This GM is reference-only — no crop type in the Crop Plan currently maps to it.'}
    </div>`;
}

function gmCropChanged(crop) { activeGMCrop = crop; renderGM(); }

function updateGMItem(id, field, val) {
  const g = gmItems.find(x => x.id === id);
  if (!g) return;
  g[field] = val;
  save();
  renderGM();
}

function addGMItem(cat) {
  gmItems.push({ id: uid(), crop: activeGMCrop, category: cat, item:'', price:'', packSize:1, unit:'', ratePerHa:'' });
  save();
  renderGM();
}

function deleteGMItem(id) {
  gmItems = gmItems.filter(x => x.id !== id);
  save();
  renderGM();
}

function gmYieldChanged(val) {
  let y = gmItemsFor(activeGMCrop).find(g => g.category === 'Yield');
  if (!y) {
    y = { id: uid(), crop: activeGMCrop, category:'Yield', item:'Budget yield', price:'', packSize:1, unit:'kgDM/ha', ratePerHa:'' };
    gmItems.push(y);
  }
  y.price = val;
  save();
  renderGM();
}

function applyGMToSeason() {
  if (isSeasonClosed()) { alert(activeYear + ' is locked — unlock it in Crop Plan first.'); return; }
  const feeds = Object.entries(GM_SOURCE).filter(([,v]) => v === activeGMCrop).map(([k]) => k);
  const targets = yearCrop().filter(c => feeds.includes(c.crop));
  if (!targets.length) { alert('No ' + feeds.join('/') + ' rows in ' + activeYear + '.'); return; }
  const d = gmDefaults(feeds[0]);
  if (!confirm('Update Seed/Chem/Fert/Ops $/ha on ' + targets.length + ' ' + feeds.join('/') + ' row(s) in ' + activeYear + ' to the current GM figures? Yields and wastage are not changed.')) return;
  targets.forEach(c => { c.seedHA = d.seedHA; c.chemHA = d.chemHA; c.fertHA = d.fertHA; c.opsHA = d.opsHA; });
  save();
  logSync('GM costs applied to ' + targets.length + ' row(s) — ' + activeYear);
  alert('Done — ' + targets.length + ' row(s) updated.');
}

          <tbody>
            ${CROPS.filter(c=>c!=='Other').map(c => {
              const g = gmDefaults(c);

                <td style="text-align:right;font-weight:700;color:var(--info)">$${costPerNet.toFixed(3)}/kgDM</td>
              </tr>`;
            }).join('')}

        </table>
      </div>
    </div>`;
}

function saveSettings() {
  settings.scriptUrl    = document.getElementById('s-url')?.value || '';
  settings.userName     = document.getElementById('s-user')?.value || 'Brendon';
  settings.disconnected = location.protocol === 'file:' || ['localhost','127.0.0.1'].includes(location.hostname);
  save();
  startPoll();
  logSync('Settings saved');
}

function toggleDisconnect() {
  if (location.protocol === 'file:' || ['localhost','127.0.0.1'].includes(location.hostname)) {
    alert('Sync stays disconnected in local preview to protect live farm data.');
    return;
  }
  settings.disconnected = !settings.disconnected;
  save();
  renderSettings();
  logSync(settings.disconnected ? 'Sync disconnected' : 'Sync reconnected');
}

// Crop history for a paddock — case-insensitive name match, handles Golden Willow(s) etc.
function paddockCropHistory(name) {
  const n1 = (name||'').toLowerCase().trim();
  const n2 = n1.endsWith('s') ? n1.slice(0,-1) : n1+'s';
  return cropPlan.filter(c => {
    const cn = (c.paddock||'').toLowerCase().trim();
    return cn === n1 || cn === n2;
  }).sort((a,b) => b.year.localeCompare(a.year));
}

function sbClass(val, ok, warn) {
  if (!val && val !== 0) return 'sb-na';
  return val >= ok ? 'sb-ok' : val >= warn ? 'sb-warn' : 'sb-bad';
}

function renderPaddocks() {
  const tested = new Set(soilTests.map(t => t.paddockId));
  const limed  = new Set(limeEvents.map(l => l.paddockId));

  // Last crop per paddock
  const lastCrop = {};
  paddocks.forEach(p => {
    const hist = paddockCropHistory(p.name);
    if (hist.length) lastCrop[p.id] = hist[0];
  });

  const totalHaPdks = paddocks.reduce((s,p) => s + n(p.ha), 0);
  const testedCount = paddocks.filter(p => tested.has(p.id)).length;
  const activeCount = paddocks.filter(p => lastCrop[p.id]).length;

  const rows = paddocks.map(p => {
    const lc = lastCrop[p.id];
    const hasSoil = !!p.soilType;
    const hasTested = tested.has(p.id);
    const lastTest = soilTests.filter(t => t.paddockId === p.id).sort((a,b) => b.date.localeCompare(a.date))[0];
    const lastLime = limeEvents.filter(l => l.paddockId === p.id).sort((a,b) => b.date.localeCompare(a.date))[0];
    const seasons = paddockCropHistory(p.name).map(c => c.year).filter((v,i,a)=>a.indexOf(v)===i);
    return `<tr class="pdkRow" onclick="openPaddock('${p.id}')">
      <td><strong>${p.name}</strong></td>
      <td style="text-align:right">${n(p.ha).toFixed(1)}</td>
      <td style="font-size:11px;color:var(--muted)">${p.soilType ? p.soilType.split('_')[0] : '—'}</td>
      <td>${lc ? `<span class="tag ${CROP_TAG[lc.crop]||'tag-other'}">${lc.crop}</span> <span style="font-size:11px;color:var(--muted)">${lc.year}</span>` : '<span style="color:var(--muted);font-size:12px">—</span>'}</td>
      <td style="text-align:center;font-size:12px">${seasons.length || '—'}</td>
      <td style="font-size:12px">${lastTest ? displayAppDate(lastTest.date) + ' pH&nbsp;' + lastTest.pH : '<span style="color:var(--muted)">—</span>'}</td>
      <td style="font-size:12px">${lastLime ? displayAppDate(lastLime.date) + ((lastLime.rateT===''||lastLime.rateT==null)?'':' ' + lastLime.rateT + 't') : '<span style="color:var(--muted)">—</span>'}</td>
      <td><button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();openPaddock('${p.id}')">Open</button></td>
    </tr>`;
  }).join('');

  document.getElementById('tab-paddocks').innerHTML = `
    <div class="cards">
      <div class="card"><div class="label">Cropping Paddocks</div><div class="value">${paddocks.length}</div><div class="sub">${totalHaPdks.toFixed(0)} ha total</div></div>

      <div class="card"><div class="label">In Crop History</div><div class="value">${activeCount}</div><div class="sub">have season records</div></div>
    </div>
    <div class="toolbar">
      <button class="btn btn-primary" onclick="addPaddock()">+ Add Paddock</button>
      <span style="font-size:12px;color:var(--muted)">Click any row to open history &amp; soil data</span>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>Paddock</th><th style="text-align:right">Ha</th><th>Soil Type</th>
          <th>Last Crop</th><th style="text-align:center">Seasons</th>
          <th>Last Soil Test</th><th>Last Lime</th><th></th>
        </tr></thead>
        <tbody>${rows || '<tr><td colspan="8" style="color:var(--muted);padding:12px">No paddocks — click + Add Paddock</td></tr>'}</tbody>
      </table>
    </div>`;
}

function openPaddock(id) {
  const p = paddocks.find(x => x.id === id);
  if (!p) return;
  document.getElementById('pdkModalName').textContent = p.name;
  renderPaddockDetail(id);
  document.getElementById('pdkModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closePaddock() {
  document.getElementById('pdkModal').classList.remove('open');
  document.body.style.overflow = '';
}

function renderPaddockDetail(id) {
  const p = paddocks.find(x => x.id === id);
  if (!p) return;

  // Crop history (computed)
  const hist = paddockCropHistory(p.name);
  const histRows = hist.length ? hist.map(c => {
    const budYld   = n(c.yieldKgHA);
    const actYld   = hasActual(c) ? n(c.actualYieldKgHA) : null;
    const nDM      = effectiveNetDM(c);
    const cost     = rowCost(c);
    const deltaPct = (actYld !== null && budYld > 0) ? Math.round((actYld - budYld) / budYld * 100) : null;
    const actCell  = actYld !== null
      ? `<span style="color:var(--info);font-weight:700">${actYld.toLocaleString()}</span>${deltaPct!==null?` <span style="color:${deltaPct>=0?'var(--ok)':'var(--danger)'}">${deltaPct>=0?'+':''}${deltaPct}%</span>`:''}`
      : `<span style="color:var(--muted)">—</span>`;
    return `<tr>
      <td><span class="yr-badge">${c.year}</span></td>
      <td><span class="tag ${CROP_TAG[c.crop]||'tag-other'}">${c.crop}</span></td>
      <td style="text-align:right">${n(c.ha).toFixed(1)}</td>
      <td style="text-align:right">${budYld.toLocaleString()}</td>
      <td style="text-align:right">${actCell}</td>
      <td style="text-align:right">${fmtT(nDM)}</td>
      <td style="text-align:right">${fmt$(cost)}</td>
      <td style="text-align:right;color:var(--info)">${effectiveGrossDM(c) > 0 ? '$' + (cost/effectiveGrossDM(c)).toFixed(3) + '/kgDM' : '—'}</td>
      <td style="font-size:11px;color:var(--muted)">${c.notes||''}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="9" class="no-data" style="padding:10px 0">No crop history for this paddock</td></tr>`;

  // Soil tests
  const tests = soilTests.filter(t => t.paddockId === id).sort((a,b) => b.date.localeCompare(a.date));
  const testRows = tests.length ? tests.map(t => {
    const pHc  = sbClass(t.pH,    6.0, 5.5);
    const Pc   = sbClass(t.olsenP,25,  15);
    const Kc   = sbClass(t.qtK,   8,   5);
    const Sc   = sbClass(t.ss,    15,  10);
    const Cac  = sbClass(t.qtCa,  10,  8);
    return `<tr>
      <td style="font-size:12px">${displayAppDate(t.date)}</td>
      <td style="text-align:center"><span class="sb ${pHc}">${t.pH||'—'}</span></td>
      <td style="text-align:center"><span class="sb ${Pc}">${t.olsenP||'—'}</span></td>
      <td style="text-align:center"><span class="sb ${Kc}">${t.qtK||'—'}</span></td>
      <td style="text-align:center"><span class="sb ${Sc}">${t.ss||'—'}</span></td>
      <td style="text-align:center"><span class="sb ${Cac}">${t.qtCa||'—'}</span></td>
      <td style="font-size:11px;color:var(--muted);max-width:180px">${t.notes||''}</td>
      <td><button class="del-btn" onclick="deleteSoilTest('${t.id}','${id}')">✕</button></td>
    </tr>`;
  }).join('') : `<tr><td colspan="8" class="no-data" style="padding:10px 0">No soil tests recorded</td></tr>`;

  // Lime events
  const limes = limeEvents.filter(l => l.paddockId === id).sort((a,b) => b.date.localeCompare(a.date));
  const limeRows = limes.length ? limes.map(l => {
    return `<tr>
      <td style="font-size:12px">${displayAppDate(l.date)}</td>
      <td style="text-align:right;font-weight:700">${(l.rateT===''||l.rateT==null)?'<span style="color:var(--muted)">—</span>':l.rateT+'t'}</td>
      <td style="font-size:11px;color:var(--muted)">${l.notes||''}</td>
      <td><button class="del-btn" onclick="deleteLimeEvent('${l.id}','${id}')">✕</button></td>
    </tr>`;
  }).join('') : `<tr><td colspan="4" class="no-data" style="padding:10px 0">No lime events recorded</td></tr>`;

  document.getElementById('pdkModalBody').innerHTML = `
    <div class="pdkSect">
      <div class="meta-row">
        <div class="meta-item"><strong>${n(p.ha).toFixed(1)} ha</strong> mapped area</div>
        <div class="meta-item"><strong>Soil:</strong> ${p.soilType || '<em>not set</em>'}</div>
      </div>
      <div class="form-group" style="margin:10px 0 0">
        <label style="font-size:11px;font-weight:600;color:var(--muted)">Notes</label>
        <textarea class="pdkNote-area" id="pdkNote-${id}" onchange="savePaddockField('${id}','notes',this.value)">${p.notes||''}</textarea>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
        <div class="form-group" style="margin:0;flex:1;min-width:120px">
          <label style="font-size:11px;font-weight:600;color:var(--muted)">Ha</label>
          <input type="number" step="0.01" value="${p.ha||''}" style="width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px" onchange="savePaddockField('${id}','ha',this.value)">
        </div>
        <div class="form-group" style="margin:0;flex:2;min-width:160px">
          <label style="font-size:11px;font-weight:600;color:var(--muted)">Soil Type (S-map code)</label>
          <input type="text" value="${p.soilType||''}" style="width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px" onchange="savePaddockField('${id}','soilType',this.value)">
        </div>
        <div style="display:flex;align-items:flex-end">
          <button class="btn btn-sm btn-danger" onclick="deletePaddock('${id}')">Delete Paddock</button>
        </div>
      </div>
    </div>

    <div class="pdkSect">
      <div class="pdkSect-hdr">
        <span class="pdkSect-title">Crop History (${hist.length} seasons)</span>
      </div>
      <div class="tbl-wrap" style="margin:0">
        <table style="font-size:12px">
          <thead><tr><th>Season</th><th>Crop</th><th style="text-align:right">Ha</th><th style="text-align:right">Budget kgDM/ha</th><th style="text-align:right;color:#90CAF9">Actual kgDM/ha</th><th style="text-align:right">Net DM</th><th style="text-align:right">Cost</th><th style="text-align:right">$/kgDM</th><th>Notes</th></tr></thead>
          <tbody>${histRows}</tbody>
        </table>
      </div>
    </div>

    <div class="pdkSect">
      <div class="pdkSect-hdr">
        <span class="pdkSect-title">Soil Tests</span>
        <button class="btn btn-sm btn-ghost" onclick="addSoilTest('${id}')">+ Add Test</button>
      </div>
      <p style="font-size:11px;color:var(--muted);margin-bottom:8px">
        <span class="sb sb-ok">ok</span> <span class="sb sb-warn">marginal</span> <span class="sb sb-bad">low</span> &nbsp;
        pH ≥6.0 | Olsen P ≥25 | QT K ≥8 | SS ≥15 | QT Ca ≥10
      </p>
      <div class="tbl-wrap" style="margin:0">
        <table style="font-size:12px">
          <thead><tr><th>Date</th><th style="text-align:center">pH</th><th style="text-align:center">Ol P</th><th style="text-align:center">QT K</th><th style="text-align:center">SS</th><th style="text-align:center">QT Ca</th><th>Notes</th><th></th></tr></thead>
          <tbody>${testRows}</tbody>
        </table>
      </div>
    </div>

    <div class="pdkSect">
      <div class="pdkSect-hdr">
        <span class="pdkSect-title">Lime History</span>
        <button class="btn btn-sm btn-ghost" onclick="addLimeEvent('${id}')">+ Add Lime</button>
      </div>
      <div class="tbl-wrap" style="margin:0">
        <table style="font-size:12px">
          <thead><tr><th>Date</th><th style="text-align:right">Rate (t/ha)</th><th>Notes</th><th></th></tr></thead>
          <tbody>${limeRows}</tbody>
        </table>
      </div>
    </div>`;
}

function addPaddock() {
  const name = prompt('Paddock name:');
  if (!name || !name.trim()) return;
  const p = { id: uid(), name: name.trim(), ha: '', soilType: '', notes: '' };
  paddocks.push(p);
  save();
  renderPaddocks();
  openPaddock(p.id);
}

function savePaddockField(id, field, val) {
  const p = paddocks.find(x => x.id === id);
  if (!p) return;
  p[field] = field === 'ha' ? (parseFloat(val) || 0) : val;
  save();
  renderPaddocks();
}

function deletePaddock(id) {
  const p = paddocks.find(x => x.id === id);
  if (!p || !confirm('Delete ' + p.name + '? This removes the paddock entry only — crop plan rows are unchanged.')) return;
  paddocks = paddocks.filter(x => x.id !== id);
  soilTests = soilTests.filter(t => t.paddockId !== id);
  limeEvents = limeEvents.filter(l => l.paddockId !== id);
  save();
  closePaddock();
  renderPaddocks();
}

function addSoilTest(paddockId) {
  const date  = prompt('Test date (DD/MM/YYYY):', '');
  if (!date) return;
  const pH     = parseFloat(prompt('pH:', '') || 0);
  const olsenP = parseInt(prompt('Olsen P:', '') || 0);
  const qtK    = parseInt(prompt('QT K:', '') || 0);
  const ss     = parseInt(prompt('SS (sulphur):', '') || 0);
  const qtCa   = parseInt(prompt('QT Ca:', '') || 0);
  const notes  = prompt('Notes (optional):', '') || '';
  soilTests.push({ id: uid(), paddockId, date, pH, olsenP, qtK, ss, qtCa, notes });
  save();
  renderPaddockDetail(paddockId);
}

function deleteSoilTest(id, paddockId) {
  if (!confirm('Delete this soil test?')) return;
  soilTests = soilTests.filter(t => t.id !== id);
  save();
  renderPaddockDetail(paddockId);
}

function addLimeEvent(paddockId) {
  const date  = prompt('Date applied (DD/MM/YYYY):', '');
  if (!date) return;
  const rateT = parseFloat(prompt('Rate (t/ha):', '') || 0);
  const notes = prompt('Notes (optional):', '') || '';
  limeEvents.push({ id: uid(), paddockId, date, rateT, notes });
  save();
  renderPaddockDetail(paddockId);
}

function deleteLimeEvent(id, paddockId) {
  if (!confirm('Delete this lime event?')) return;
  limeEvents = limeEvents.filter(l => l.id !== id);
  save();
  renderPaddockDetail(paddockId);
}

// -- REPORTS --
function openReport() {
  document.getElementById('reportView').classList.add('open');
  document.body.classList.add('report-open');
  document.body.style.overflow = 'hidden';
  buildReport();
}

function closeReport() {
  document.getElementById('reportView').classList.remove('open');
  document.body.classList.remove('report-open');
  document.body.style.overflow = '';
}

function setReportPreset(preset) {
  const setChk = (id, v) => { const el = document.getElementById(id); if (el) el.checked = v; };
  if (preset === 'full') {
    ['summary','crop','operations','regrass','stock','feed','financial'].forEach(s => setChk('rpt-s-'+s, true));
    setChk('rpt-costs', true);
  } else if (preset === 'field') {
    setChk('rpt-s-summary', true);
    setChk('rpt-s-crop', true);
    setChk('rpt-s-operations', true);
    setChk('rpt-s-regrass', true);
    setChk('rpt-s-stock', false);
    setChk('rpt-s-feed', false);
    setChk('rpt-s-financial', false);
    setChk('rpt-costs', false);
  }
  buildReport();
}

function rptChecked(id) { const el = document.getElementById(id); return !!el && el.checked; }

// Sheets date cells pull back as ISO timestamps — show dd/mm/yyyy in reports
function rptDate(v) {
  if (!v) return '—';
  const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})T/);
  return m ? m[3] + '/' + m[2] + '/' + m[1] : String(v);
}

function buildReport() {
  const costs = rptChecked('rpt-costs');
  let html = `
    <h1>Peel Forest Estate — Cropping Programme ${activeYear}</h1>
    <div class="rpt-meta">Prepared by Peel Forest Estate · ${new Date().toLocaleDateString('en-NZ', { day:'numeric', month:'long', year:'numeric' })} · PFE Cropping v${APP_VER}</div>`;

  if (rptChecked('rpt-s-summary'))   html += rptSummary(costs);
  if (rptChecked('rpt-s-crop'))      html += rptCropPlan(costs);
  if (rptChecked('rpt-s-operations')) html += rptOperations();
  if (rptChecked('rpt-s-regrass'))   html += rptRegrass(costs);
  if (rptChecked('rpt-s-stock'))     html += rptStock();
  if (rptChecked('rpt-s-feed'))      html += rptFeed();
  if (rptChecked('rpt-s-financial')) html += rptFinancial();

  document.getElementById('report-content').innerHTML = html;
}

function rptSummary(costs) {
  const dem = totalDemand(), sup = totalSupply(), sur = surplus();
  const costRows = costs ? `
    <tr><td>Crop establishment cost</td><td class="rpt-r">${fmt$(totalCropCost())}</td></tr>
    <tr><td>Supplement cost</td><td class="rpt-r">${fmt$(totalSuppCost())}</td></tr>
    <tr><td>Pasture cost</td><td class="rpt-r">${fmt$(pastureCost())}</td></tr>
    <tr><td>Regrassing cost</td><td class="rpt-r">${fmt$(totalRegrassCost())}</td></tr>
    <tr class="rpt-tot"><td>Total programme cost</td><td class="rpt-r">${fmt$(totalCropCost()+totalSuppCost()+pastureCost()+totalRegrassCost())}</td></tr>` : '';
  return `
    <h2>Season Summary</h2>
    <table>
      <tr><td>Total crop area</td><td class="rpt-r">${totalHa().toFixed(1)} ha (${yearCrop().length} paddocks)</td></tr>
      <tr><td>Regrassing area</td><td class="rpt-r">${totalRegrassHa().toFixed(1)} ha (${yearRegrass().length} paddocks)</td></tr>
      <tr><td>Winter DM supply (crops + supplements + pasture)</td><td class="rpt-r">${fmtDM(sup)}</td></tr>
      <tr><td>Winter DM demand (all stock classes)</td><td class="rpt-r">${fmtDM(dem)}</td></tr>
      <tr class="rpt-tot"><td>Surplus / deficit</td><td class="rpt-r">${sur >= 0 ? '+' : ''}${fmtDM(sur)}</td></tr>
      ${costRows}
    </table>`;
}

function rptCropPlan(costs) {
  const byType = {};
  yearCrop().forEach(c => { (byType[c.crop] = byType[c.crop] || []).push(c); });
  if (!Object.keys(byType).length) return `<h2>Crop Plan</h2><p class="rpt-note">No crops entered for ${activeYear}.</p>`;
  const costTh = costs ? `<th class="rpt-r">$/ha</th><th class="rpt-r">Total $</th>` : '';
  let rows = '';
  Object.entries(byType).forEach(([crop, list]) => {
    list.forEach(c => {
      const perHa = n(c.seedHA)+n(c.chemHA)+n(c.fertHA)+n(c.opsHA);
      const costTd = costs ? `<td class="rpt-r">${fmt$(perHa)}</td><td class="rpt-r">${fmt$(rowCost(c))}</td>` : '';
      rows += `<tr>
        <td>${c.paddock||'—'}</td><td>${crop}</td>
        <td class="rpt-r">${n(c.ha).toFixed(1)}</td>
        <td>${rptDate(c.drillDate)}</td>
        <td>${c.winterUse||'Winter feed'}</td>
        <td class="rpt-r">${n(c.yieldKgHA).toLocaleString()}</td>
        <td class="rpt-r">${hasActual(c) ? n(c.actualYieldKgHA).toLocaleString() : '—'}</td>
        <td class="rpt-r">${fmtDM(effectiveNetDM(c))}</td>
        ${costTd}
        <td>${c.notes||''}</td>
      </tr>`;
    });
    const tHa = list.reduce((s,c) => s+n(c.ha), 0);
    const tDM = list.reduce((s,c) => s+effectiveNetDM(c), 0);
    const tCost = costs ? `<td class="rpt-r"></td><td class="rpt-r">${fmt$(list.reduce((s,c) => s+rowCost(c), 0))}</td>` : '';
    rows += `<tr class="rpt-tot"><td>${crop} total</td><td></td><td class="rpt-r">${tHa.toFixed(1)}</td><td colspan="3"></td><td></td><td class="rpt-r">${fmtDM(tDM)}</td>${tCost}<td></td></tr>`;
  });
  return `
    <h2>Crop Plan — ${activeYear}</h2>
    <table>
      <thead><tr><th>Paddock</th><th>Crop</th><th class="rpt-r">Ha</th><th>Drill Date</th><th>Winter Use</th><th class="rpt-r">Budget kgDM/ha</th><th class="rpt-r">Actual kgDM/ha</th><th class="rpt-r">Net DM</th>${costTh}<th>Notes</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <p class="rpt-note">Net DM = area × yield less wastage (actual yields used where recorded). "To silage" and "Summer feed" rows are excluded from winter supply.</p>`;
}

function rptRegrass(costs) {
  const list = yearRegrass();
  if (!list.length) return '';
  const costTh = costs ? `<th class="rpt-r">$/ha</th><th class="rpt-r">Total $</th>` : '';
  const rows = list.map(r => {
    const perHa = n(r.seedHA)+n(r.chemHA)+n(r.fertHA)+n(r.opsHA);
    const costTd = costs ? `<td class="rpt-r">${fmt$(perHa)}</td><td class="rpt-r">${fmt$(regrassRowCost(r))}</td>` : '';
    return `<tr><td>${r.paddock||'—'}</td><td>${r.mix||'—'}</td><td class="rpt-r">${n(r.ha).toFixed(1)}</td><td>${rptDate(r.drillDate)}</td>${costTd}<td>${r.notes||''}</td></tr>`;
  }).join('');
  const totCost = costs ? `<td class="rpt-r"></td><td class="rpt-r">${fmt$(totalRegrassCost())}</td>` : '';
  return `
    <h2>Regrassing Programme — ${activeYear}</h2>
    <table>
      <thead><tr><th>Paddock</th><th>Mix</th><th class="rpt-r">Ha</th><th>Drill Date</th>${costTh}<th>Notes</th></tr></thead>
      <tbody>${rows}<tr class="rpt-tot"><td>Total</td><td></td><td class="rpt-r">${totalRegrassHa().toFixed(1)}</td><td></td>${totCost}<td></td></tr></tbody>
    </table>
    <p class="rpt-note">Regrassing is pasture renewal — costs only, not part of the winter feed supply.</p>`;
}

function updateCropDraft(id, field, val) {
  const c = cropPlan.find(x => x.id === id);
  if (!c) return;
  c[field] = val;
  if (['paddock','drillDate'].includes(field)) ensureOperationsForSeason();
  saveLocal();
}

function rptOperations() {
  const list = yearOperations();
  if (!list.length) return '';
  const counts = operationCounts(list);
  let rows = '';
  yearCrop().forEach(c => {
    const tasks = sourceOperations(c.id);
    if (!tasks.length) return;
    const p = opSourceProgress(c.id);
    rows += `<tr class="rpt-tot"><td colspan="7">${esc(c.paddock)} — ${esc(c.crop)} · ${p.passed}/${p.total} passed</td></tr>`;
    tasks.forEach(o => {
      const status = opNeedsVerification(o) ? 'Awaiting verification' : o.status;
      const completed = o.completedAt ? `${displayAppDate(o.completedAt)} · ${esc(o.completedBy)}` : '—';
      const verified = o.verifiedAt ? `${displayAppDate(o.verifiedAt)} · ${esc(o.verifiedBy)}` : opRequiresVerification(o) ? 'Required' : '—';
      rows += `<tr>
        <td>${esc(o.stage)}</td><td>${esc(o.title)}</td><td>${esc(displayAppDate(o.dueDate))}</td>
        <td>${esc(o.assignee || 'Unassigned')}</td><td>${esc(status)}</td>
        <td>${completed}<br><span style="font-size:10px;color:#666">Verify: ${verified}</span></td>
        <td>${esc(o.record || o.notes || '')}</td>
      </tr>`;
    });
  });
  return `
    <h2>Crop Assurance — ${activeYear}</h2>
    <p class="rpt-note">${OP_TEMPLATE_VERSION} · ${counts.passed}/${counts.total} passed · ${counts.overdue} overdue · ${counts.attention} attention or verification.</p>
    <table>
      <thead><tr><th>Stage</th><th>Operation</th><th>Target</th><th>Responsible</th><th>Status</th><th>Completion</th><th>Record / notes</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function rptStock() {
  const mkRows = list => list.map(r => `<tr>
    <td>${r.cls||'—'}</td><td class="rpt-r">${n(r.headCurr).toLocaleString()}</td>
    <td class="rpt-r">${n(r.kgDMday)}</td><td>${r.period||'—'}</td><td class="rpt-r">${n(r.days)}</td>
    <td>${r.feedSource||'—'}</td><td class="rpt-r">${fmtDM(n(r.headCurr)*n(r.kgDMday)*n(r.days))}</td>
  </tr>`).join('');
  const deer   = yearStock().filter(r => r.species === 'Deer');
  const cattle = yearStock().filter(r => r.species === 'Cattle');
  const sum = list => list.reduce((s,r) => s + n(r.headCurr)*n(r.kgDMday)*n(r.days), 0);
  return `
    <h2>Stock Feed Requirements — ${activeYear}</h2>
    <table>
      <thead><tr><th>Class</th><th class="rpt-r">Head</th><th class="rpt-r">kgDM/day</th><th>Period</th><th class="rpt-r">Days</th><th>Feed Source</th><th class="rpt-r">Total kgDM</th></tr></thead>
      <tbody>
        ${mkRows(deer)}
        <tr class="rpt-tot"><td colspan="6">Deer total</td><td class="rpt-r">${fmtDM(sum(deer))}</td></tr>
        ${mkRows(cattle)}
        <tr class="rpt-tot"><td colspan="6">Cattle total</td><td class="rpt-r">${fmtDM(sum(cattle))}</td></tr>
        <tr class="rpt-tot"><td colspan="6">Total demand</td><td class="rpt-r">${fmtDM(totalDemand())}</td></tr>
      </tbody>
    </table>`;
}

function rptFeed() {
  const byType = {};
  winterCrops().forEach(c => { byType[c.crop] = (byType[c.crop] || 0) + effectiveNetDM(c); });
  const cropRows = Object.entries(byType).map(([crop, dm]) => `<tr><td>${crop} (crop)</td><td class="rpt-r">${fmtDM(dm)}</td></tr>`).join('');
  const suppRows = yearSupps().map(x => `<tr><td>${x.name||x.type||'Supplement'}</td><td class="rpt-r">${fmtDM(n(x.kgDM))}</td></tr>`).join('');
  const pastRows = yearPasture().map(p => `<tr><td>${p.name||'Pasture block'}</td><td class="rpt-r">${fmtDM(pastureRowDM(p))}</td></tr>`).join('');
  const sup = totalSupply(), dem = totalDemand(), sur = surplus();
  return `
    <h2>Winter Feed Budget — ${activeYear}</h2>
    <table>
      <thead><tr><th>Supply source</th><th class="rpt-r">kgDM</th></tr></thead>
      <tbody>
        ${cropRows}${suppRows}${pastRows}
        <tr class="rpt-tot"><td>Total supply</td><td class="rpt-r">${fmtDM(sup)}</td></tr>
        <tr><td>Total demand</td><td class="rpt-r">${fmtDM(dem)}</td></tr>
        <tr class="rpt-tot"><td>Surplus / deficit</td><td class="rpt-r">${sur >= 0 ? '+' : ''}${fmtDM(sur)}</td></tr>
      </tbody>
    </table>`;
}

function rptFinancial() {
  const byType = {};
  yearCrop().forEach(c => {
    if (!byType[c.crop]) byType[c.crop] = { ha:0, cost:0, dm:0 };
    byType[c.crop].ha += n(c.ha);
    byType[c.crop].cost += rowCost(c);
    byType[c.crop].dm += effectiveGrossDM(c);
  });
  const cropRows = Object.entries(byType).map(([crop, v]) => `<tr>
    <td>${crop}</td><td class="rpt-r">${v.ha.toFixed(1)}</td>
    <td class="rpt-r">${fmt$(v.cost/(v.ha||1))}/ha</td>
    <td class="rpt-r">${v.dm > 0 ? '$' + (v.cost/v.dm).toFixed(3) : '—'}</td>
    <td class="rpt-r">${fmt$(v.cost)}</td>
  </tr>`).join('');
  const grand = totalCropCost() + totalSuppCost() + pastureCost() + totalRegrassCost();
  return `
    <h2>Financial Summary — ${activeYear}</h2>
    <table>
      <thead><tr><th>Crop</th><th class="rpt-r">Ha</th><th class="rpt-r">$/ha</th><th class="rpt-r">$/kgDM grown</th><th class="rpt-r">Total</th></tr></thead>
      <tbody>
        ${cropRows}
        <tr class="rpt-tot"><td>Crop establishment</td><td class="rpt-r">${totalHa().toFixed(1)}</td><td></td><td></td><td class="rpt-r">${fmt$(totalCropCost())}</td></tr>
        <tr><td colspan="4">Supplements</td><td class="rpt-r">${fmt$(totalSuppCost())}</td></tr>
        <tr><td colspan="4">Pasture</td><td class="rpt-r">${fmt$(pastureCost())}</td></tr>
        <tr><td colspan="4">Regrassing (${totalRegrassHa().toFixed(1)} ha)</td><td class="rpt-r">${fmt$(totalRegrassCost())}</td></tr>
        <tr class="rpt-tot"><td colspan="4">Total programme</td><td class="rpt-r">${fmt$(grand)}</td></tr>
      </tbody>
    </table>
    <p class="rpt-note">$/kgDM on DM grown — wastage applies to the feed budget only, never to financial figures.</p>`;
}

// -- SYNC --
function setSyncPill(cls, text) {
  const el = document.getElementById('sync-pill');
  el.className = cls;
  el.textContent = text;
}

function logSync(msg) {
  document.getElementById('sync-log').textContent = msg;
  const ta = document.getElementById('sync-log-area');
  if (ta) ta.value = new Date().toLocaleTimeString('en-NZ') + ' ' + msg + '\n' + ta.value;
}

function schedulePush() {
  if (!settings.scriptUrl || settings.disconnected) return;
  if (syncPending) { pushAgain = true; return; }
  syncPending = true;
  setTimeout(pushToSheet, 1500);
}

// True while the user has a field focused — a pull-render now would wipe their typing
function isEditing() {
  const a = document.activeElement;
  return !!a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT');
}

async function pullFromSheet() {
  if (!settings.scriptUrl || settings.disconnected) { renderAll(); return; }
  setSyncPill('info', 'Pulling...');
  try {
    const res = await fetch(settings.scriptUrl + '?action=pull', { cache: 'no-store' });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    operationsBackendReady = !!data.operationsSupported;
    if (operationsBackendReady && opPushPending.size) {
      clearTimeout(opPushTimer);
      opPushTimer = setTimeout(flushOperationPush,700);
    }
    if (Array.isArray(data.cropPlan) && data.cropPlan.length) {
      data.cropPlan.forEach(c => {
        if (c.opsHA && YEAR_PAT.test(c.opsHA) && c.opsHA !== c.year) { c.year = c.opsHA; c.opsHA = ''; }
        if (!c.year) c.year = YEAR;
        if (c.actualYieldKgHA === undefined) c.actualYieldKgHA = '';
        if (c.wastage === undefined || c.wastage === null || c.wastage === '') c.wastage = GM[c.crop]?.wastage ?? 15;
        if (!c.winterUse) c.winterUse = 'Winter feed';
      });
      cropPlan = data.cropPlan;
    }
    if (Array.isArray(data.stockReq) && data.stockReq.length) {
      data.stockReq.forEach(r => { if (!r.year) r.year = YEAR; });
      stockReq = data.stockReq;
    }
    if (Array.isArray(data.supplements) && data.supplements.length) {
      data.supplements.forEach(x => { if (!x.year) x.year = YEAR; });
      supplements = data.supplements;
    }
    if (Array.isArray(data.pasture) && data.pasture.length) {
      data.pasture.forEach(p => { if (!p.year) p.year = YEAR; });
      pasture = data.pasture;
    }
    if (Array.isArray(data.regrass) && data.regrass.length) {
      data.regrass.forEach(r => { if (!r.year) r.year = YEAR; });
      regrass = data.regrass;
    }
    if (Array.isArray(data.operations)) {
      data.operations.forEach(normaliseOperation);
      operations = data.operations;
      ensureOperationsForSeason();
    }
    if (Array.isArray(data.paddocks)   && data.paddocks.length)   paddocks   = data.paddocks;
    if (Array.isArray(data.soilTests)  && data.soilTests.length)  soilTests  = data.soilTests;
    if (Array.isArray(data.limeEvents) && data.limeEvents.length) limeEvents = data.limeEvents;
    if (Array.isArray(data.gmItems)    && data.gmItems.length)    gmItems    = data.gmItems;
    if (typeof data.aiNotes === 'string' && data.aiNotes) aiNotes = data.aiNotes;
    lastTs = data.lastModified || 0;
    localStorage.setItem(NS+'lastTs', lastTs);
    saveLocal();
    setSyncPill('ok', 'Synced');
    logSync('Pulled ' + new Date().toLocaleTimeString('en-NZ'));
  } catch(e) {
    setSyncPill('warn', 'Offline');
    logSync('Pull failed: ' + e.message);
  }
  renderAll();
}

async function pushToSheet() {
  if (!settings.scriptUrl || settings.disconnected) { syncPending = false; return; }
  try {
    const payload = { cropPlan, stockReq, supplements, pasture, regrass, paddocks, soilTests, limeEvents, gmItems, aiNotes, clientTs: lastTs };
    const res = await fetch(settings.scriptUrl, { method: 'POST', body: JSON.stringify(payload) });
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    if (d.status === 'stale') {
      logSync('Conflict: another device saved first — pulled its data. Re-check your last entry.');
      syncPending = false;
      await pullFromSheet();
      return;
    }
    lastTs = d.lastModified || Date.now();
    localStorage.setItem(NS+'lastTs', lastTs);
    setSyncPill('ok', 'Synced');
    logSync('Pushed ' + new Date().toLocaleTimeString('en-NZ'));
  } catch(e) {
    setSyncPill('warn', 'Push failed');
    logSync('Push failed: ' + e.message);
  }
  syncPending = false;
  if (pushAgain) { pushAgain = false; schedulePush(); }
}

async function manualSync() {
  if (settings.disconnected) { logSync('Sync disconnected'); return; }
  await pullFromSheet();
}

function startPoll() {
  clearInterval(pollTimer);
  if (!settings.scriptUrl || settings.disconnected) return;
  pollTimer = setInterval(async () => {
    if (syncPending || isEditing()) return;
    try {
      const res = await fetch(settings.scriptUrl + '?action=pull', { cache: 'no-store' });
      const d = await res.json();
      // re-check after the fetch — an edit may have started while it was in flight
      if (syncPending || isEditing()) return;
      if ((d.lastModified || 0) > lastTs) await pullFromSheet();
    } catch(e) {}
  }, 30000);
}

// -- INIT --
load();
updateYearSel();
renderAll();
if (settings.scriptUrl && !settings.disconnected) pullFromSheet();
else setSyncPill('', settings.scriptUrl ? 'Offline' : 'No URL');
startPoll();
</script>
